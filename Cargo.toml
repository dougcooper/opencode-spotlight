[package]
name = "opencode-spotlight"
version = "0.1.0"
edition = "2024"

[dependencies]
async-channel = "2.5.0"
base64 = "0.23.1"
directories = "6.0.0"
eventsource-stream = "0.2.3"
futures-util = "0.3.34"
gdk-pixbuf = "0.22.0"
gio = "0.22.10"
glib = "0.22.10"
gtk4 = { version = "0.11.5", features = ["v4_10", "v4_12", "v4_16"] }
javascriptcore6 = "0.6.0"
libadwaita = { version = "0.9.2", features = ["v1_2", "v1_4", "v1_6"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "net"] }
toml = "1.2.1"
webkit6 = { version = "0.6.1", features = ["v2_46", "v2_48"] }

[build-dependencies]
glib-build-tools = "0.22.8"

[dev-dependencies]
httpmock = "0.9.0"
tempfile = "3.27.0"
